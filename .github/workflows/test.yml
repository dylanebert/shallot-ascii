name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  decoder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun check
      - run: bun run lint
      - name: Install software Vulkan device
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: Identify adapter
        run: |
          node -e "import('webgpu').then(({ create, globals }) => { Object.assign(globalThis, globals); return create([]).requestAdapter(); }).then(async (adapter) => { if (!adapter) throw new Error('WebGPU adapter unavailable'); const info = adapter.info; (await adapter.requestDevice()).destroy(); console.info('WebGPU adapter:', [info.vendor, info.architecture, info.device, info.description].join(' ')); })"
      - run: bun run test
